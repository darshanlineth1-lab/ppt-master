  <g id="sec-applications" data-pptx-bounds="80 1452 1080 166">
    <rect x="80" y="1464" width="8" height="32" rx="4" fill="#EE8FB0"/>
    <text x="102" y="1489" font-family="Georgia" font-size="28" font-weight="bold" fill="#2C6C9E">Applications of Reflection</text>
    <g id="applications-list" fill="#2F3B4A">
      <text x="80" y="1533">• <tspan font-weight="bold" fill="#2C5F8A">Plane mirrors:</tspan> looking glasses, periscopes and kaleidoscopes.</text>
      <text x="80" y="1569">• <tspan font-weight="bold" fill="#2C5F8A">Concave mirrors:</tspan> shaving and dental mirrors, headlight reflectors, solar furnaces.</text>
      <text x="80" y="1605">• <tspan font-weight="bold" fill="#2C5F8A">Convex mirrors:</tspan> rear-view and road-safety mirrors with a wide field of view.</text>
    </g>
  </g>

