      <text x="344" y="922" font-size="20" fill="#4A5D72">Smooth surface: parallel rays remain parallel</text>
      <text x="896" y="894" font-size="22" font-weight="bold" fill="#2C5F8A">Diffused (irregular) reflection</text>
      <text x="896" y="922" font-size="20" fill="#4A5D72">Rough surface: rays scatter in many directions</text>
    </g>
  </g>

