  <g id="lead-reflection" data-pptx-bounds="80 205 1080 84">
    <text x="80" y="240" fill="#2F3B4A"><tspan font-weight="bold" fill="#2C6C9E">Reflection</tspan> is the bouncing back of light into the same medium when it strikes a surface.<tspan x="80" dy="34">A smooth, polished surface such as a mirror reflects most of the light falling on it.</tspan></text>
  </g>

  <g id="sec-laws" data-pptx-bounds="80 306 520 326">
    <rect x="80" y="319" width="8" height="32" rx="4" fill="#EE8FB0"/>
    <text x="102" y="344" font-family="Georgia" font-size="28" font-weight="bold" fill="#2C6C9E">Laws of Reflection</text>
    <rect x="80" y="368" width="520" height="262" rx="16" fill="#FDEEF3" stroke="#F6BFD0" stroke-width="1.5"/>
    <text x="104" y="410" fill="#2F3B4A"><tspan font-weight="bold" fill="#B8456F">1.</tspan> The angle of incidence is equal to<tspan x="104" dy="34">the angle of reflection:  <tspan font-weight="bold" font-style="italic" fill="#B8456F">i = r</tspan>.</tspan></text>
    <text x="104" y="492" fill="#2F3B4A"><tspan font-weight="bold" fill="#B8456F">2.</tspan> The incident ray, the reflected ray<tspan x="104" dy="34">and the normal at the point of</tspan><tspan x="104" dy="34">incidence all lie in the same plane.</tspan></text>
    <text x="104" y="608" font-size="20" font-style="italic" fill="#4A5D72">Both laws hold for curved mirrors as well.</text>
  </g>
  <g id="laws-diagram" data-pptx-bounds="620 318 540 312">
