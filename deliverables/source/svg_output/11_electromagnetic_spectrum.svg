  <g id="def-spectrum" data-pptx-bounds="80 205 1080 134">
    <rect x="80" y="205" width="1080" height="134" rx="16" fill="#EAF5FD" stroke="#B9DCF5" stroke-width="1.5"/>
    <text x="108" y="246" fill="#2F3B4A">The <tspan font-weight="bold" fill="#2C6C9E">electromagnetic spectrum</tspan> is the orderly arrangement of electromagnetic waves<tspan x="108" dy="34">according to wavelength or frequency. All of them travel in vacuum at the speed <tspan font-style="italic">c</tspan>;</tspan><tspan x="108" dy="34">they differ only in wavelength and frequency, which are related by <tspan font-style="italic">c = νλ</tspan>.</tspan></text>
  </g>

