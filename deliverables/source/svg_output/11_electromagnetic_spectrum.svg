    <g id="table-regions" font-size="21" font-weight="bold" fill="#2C5F8A">
      <text x="118" y="772">Radio waves</text>
      <text x="118" y="856">Microwaves</text>
      <text x="118" y="940">Infrared</text>
      <text x="118" y="1024">Visible light</text>
      <text x="118" y="1108">Ultraviolet</text>
      <text x="118" y="1192">X-rays</text>
      <text x="118" y="1276">Gamma rays</text>
    </g>
    <g id="table-wavelengths" font-size="20" fill="#2F3B4A">
      <text x="310" y="772">&gt; 0.1 m</text>
      <text x="310" y="856">0.1 m – 1 mm</text>
      <text x="310" y="940">1 mm – 700 nm</text>
      <text x="310" y="1024">700 – 400 nm</text>
      <text x="310" y="1108">400 – 1 nm</text>
      <text x="310" y="1192">1 – 10<tspan baseline-shift="super" font-size="14">−3</tspan> nm</text>
      <text x="310" y="1276">&lt; 10<tspan baseline-shift="super" font-size="14">−3</tspan> nm</text>
    </g>
    <g id="table-frequencies" font-size="20" fill="#2F3B4A">
      <text x="510" y="772">&lt; 3 × 10<tspan baseline-shift="super" font-size="14">9</tspan> Hz</text>
      <text x="510" y="856">3 × 10<tspan baseline-shift="super" font-size="14">9</tspan> – 3 × 10<tspan baseline-shift="super" font-size="14">11</tspan> Hz</text>
      <text x="510" y="940">3 × 10<tspan baseline-shift="super" font-size="14">11</tspan> – 4 × 10<tspan baseline-shift="super" font-size="14">14</tspan> Hz</text>
      <text x="510" y="1024">4 × 10<tspan baseline-shift="super" font-size="14">14</tspan> – 8 × 10<tspan baseline-shift="super" font-size="14">14</tspan> Hz</text>
      <text x="510" y="1108">8 × 10<tspan baseline-shift="super" font-size="14">14</tspan> – 3 × 10<tspan baseline-shift="super" font-size="14">17</tspan> Hz</text>
      <text x="510" y="1192">3 × 10<tspan baseline-shift="super" font-size="14">17</tspan> – 3 × 10<tspan baseline-shift="super" font-size="14">20</tspan> Hz</text>
      <text x="510" y="1276">&gt; 3 × 10<tspan baseline-shift="super" font-size="14">20</tspan> Hz</text>
    </g>
    <g id="table-uses" font-size="20" fill="#2F3B4A">
      <text x="760" y="760">Radio and television broadcasting,<tspan x="760" dy="26">mobile phones</tspan></text>
      <text x="760" y="844">Radar, satellite links,<tspan x="760" dy="26">microwave ovens</tspan></text>
      <text x="760" y="928">Remote controls, night vision,<tspan x="760" dy="26">heat therapy</tspan></text>
      <text x="760" y="1012">Vision, photography,<tspan x="760" dy="26">optical instruments</tspan></text>
      <text x="760" y="1096">Water sterilisation,<tspan x="760" dy="26">detecting forged notes</tspan></text>
      <text x="760" y="1180">Medical radiography,<tspan x="760" dy="26">study of crystals</tspan></text>
      <text x="760" y="1264">Cancer treatment,<tspan x="760" dy="26">sterilising instruments</tspan></text>
    </g>
  </g>

  <g id="sec-notes" data-pptx-bounds="80 1330 1080 290">
    <rect x="80" y="1336" width="8" height="32" rx="4" fill="#EE8FB0"/>
    <text x="102" y="1361" font-family="Georgia" font-size="28" font-weight="bold" fill="#2C6C9E">Points to Remember</text>
    <g id="notes-list" fill="#2F3B4A">
      <text x="80" y="1405">• The boundaries between regions are approximate and neighbouring regions overlap.</text>
      <text x="80" y="1441">• Visible light is only a very narrow band of the whole spectrum.</text>
      <text x="80" y="1477">• The energy of a photon, <tspan font-style="italic">E = hν</tspan>, increases from radio waves to gamma rays.</text>
      <text x="80" y="1513">• Ultraviolet, X-rays and gamma rays can damage living tissue; the ozone layer</text>
      <text x="98" y="1547">absorbs most of the Sun's ultraviolet radiation.</text>
      <text x="80" y="1583">• Radio waves and microwaves come from oscillating circuits; X-rays and gamma rays</text>
      <text x="98" y="1617">come from inner-shell electrons and atomic nuclei.</text>
    </g>
  </g>

