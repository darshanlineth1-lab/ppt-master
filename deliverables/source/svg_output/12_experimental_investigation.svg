<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 1754" lang="en-IN" data-pptx-page-role="content" font-family="Arial" font-size="24">
  <defs>
    <linearGradient id="hdr" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#DCEFFB"/>
      <stop offset="100%" stop-color="#FCE4EC"/>
    </linearGradient>
    <marker id="arRose" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="12" refX="14" refY="6" orient="auto">
      <polygon points="0,0 16,6 0,12" fill="#D95C86"/>
    </marker>
    <marker id="arGrey" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="10" refX="12" refY="5" orient="auto">
      <polygon points="0,0 14,5 0,10" fill="#7F93A8"/>
    </marker>
  </defs>
  <rect id="page-bg" data-pptx-role="background" x="0" y="0" width="1240" height="1754" fill="#FFFFFF"/>
  <g id="page-frame" data-pptx-role="decoration" data-pptx-bounds="30 30 1180 1694">
    <rect x="30" y="30" width="1180" height="1694" rx="24" fill="none" stroke="#A7D3F2" stroke-width="3"/>
    <rect x="44" y="44" width="1152" height="1666" rx="14" fill="none" stroke="#F6BFD0" stroke-width="1.5"/>
    <circle cx="60" cy="60" r="6" fill="#A7D3F2"/>
    <circle cx="1180" cy="60" r="6" fill="#A7D3F2"/>
    <circle cx="60" cy="1694" r="6" fill="#A7D3F2"/>
    <circle cx="1180" cy="1694" r="6" fill="#A7D3F2"/>
  </g>
  <g id="page-header" data-pptx-role="header" data-pptx-bounds="80 70 1080 100">
    <rect x="80" y="70" width="1080" height="100" rx="18" fill="url(#hdr)"/>
    <circle cx="140" cy="120" r="34" fill="#FFFFFF"/>
    <use data-icon="phosphor-duotone/flask" x="118" y="98" width="44" height="44" fill="#5AA9E0"/>
    <text x="196" y="106" font-size="17" fill="#5C7F9F">PHYSICS INVESTIGATORY PROJECT  ·  CLASS XII</text>
    <text x="196" y="150" font-family="Georgia" font-size="40" font-weight="bold" fill="#2C5F8A">Experimental Investigation</text>
    <path d="M920 120 H1136" fill="none" stroke="#FFFFFF" stroke-width="2"/>
    <path d="M924 120 q13 -40 26 0 t26 0 t26 0 t26 0 t26 0 t26 0 t26 0 t26 0" fill="none" stroke="#EE8FB0" stroke-width="3"/>
  </g>

  <g id="exp-title" data-pptx-bounds="80 205 1080 62">
    <rect x="80" y="205" width="1080" height="62" rx="14" fill="#F3EFFC" stroke="#D3C8EE" stroke-width="1.5"/>
    <text x="620" y="245" text-anchor="middle" font-family="Georgia" font-size="25" font-weight="bold" fill="#5A4A9C">Young's Double-Slit Experiment: Measuring the Wavelength of Light</text>
  </g>

  <g id="sec-aim" data-pptx-bounds="80 282 528 196">
    <rect x="80" y="282" width="528" height="196" rx="16" fill="#EAF5FD" stroke="#B9DCF5" stroke-width="1.5"/>
    <text x="104" y="318" font-family="Georgia" font-size="24" font-weight="bold" fill="#2C6C9E">Aim</text>
    <text x="104" y="354" font-size="21" fill="#2F3B4A">To observe the interference fringes<tspan x="104" dy="29">produced by a double slit and to determine</tspan><tspan x="104" dy="29">the wavelength of the laser light used by</tspan><tspan x="104" dy="29">measuring the fringe width.</tspan></text>
  </g>
  <g id="sec-apparatus" data-pptx-bounds="632 282 528 196">
    <rect x="632" y="282" width="528" height="196" rx="16" fill="#FDEEF3" stroke="#F6BFD0" stroke-width="1.5"/>
    <text x="656" y="318" font-family="Georgia" font-size="24" font-weight="bold" fill="#B8456F">Apparatus Required</text>
    <text x="656" y="354" font-size="21" fill="#2F3B4A">Red diode laser pointer, double slit of<tspan x="656" dy="29">known separation <tspan font-style="italic">d</tspan>, white screen, two</tspan><tspan x="656" dy="29">stands with clamps, metre scale and a</tspan><tspan x="656" dy="29">millimetre scale (or graph paper).</tspan></text>
  </g>

  <g id="sec-theory" data-pptx-bounds="80 494 1080 118">
    <rect x="80" y="498" width="8" height="30" rx="4" fill="#EE8FB0"/>
    <text x="102" y="522" font-family="Georgia" font-size="26" font-weight="bold" fill="#2C6C9E">Theory</text>
    <text x="80" y="562" font-size="22" fill="#2F3B4A">Light from the two slits superposes on the screen and forms equally spaced bright and dark<tspan x="80" dy="30">fringes. For slit separation <tspan font-style="italic">d</tspan> and slit-to-screen distance <tspan font-style="italic">D</tspan>, the fringe width is <tspan font-style="italic" font-weight="bold" fill="#B8456F">β = λD/d</tspan>.</tspan></text>
  </g>

  <g id="sec-arrangement" data-pptx-bounds="80 626 528 372">
    <rect x="80" y="630" width="8" height="30" rx="4" fill="#EE8FB0"/>
    <text x="102" y="654" font-family="Georgia" font-size="26" font-weight="bold" fill="#2C6C9E">Experimental Arrangement</text>
    <rect x="80" y="676" width="528" height="322" rx="16" fill="#FFFFFF" stroke="#CFE6F7" stroke-width="1.5"/>
    <path d="M110 900 H580" fill="none" stroke="#9FB3C8" stroke-width="5" stroke-linecap="round"/>
    <rect x="110" y="790" width="96" height="34" rx="8" fill="#F6BFD0" stroke="#D9739A" stroke-width="2"/>
    <path d="M158 824 V900 M268 760 V900 M540 730 V900" fill="none" stroke="#7F93A8" stroke-width="4"/>
    <rect x="258" y="762" width="20" height="90" rx="3" fill="#DCEFFB" stroke="#5C7F9F" stroke-width="2"/>
    <path d="M268 800 V804 M268 810 V814" fill="none" stroke="#2C5F8A" stroke-width="3"/>
    <rect x="532" y="716" width="16" height="170" rx="3" fill="#F4FAFE" stroke="#2C5F8A" stroke-width="2.5"/>
    <path d="M278 807 L532 742 V872 Z" fill="#FDEEF3"/>
    <line x1="206" y1="807" x2="258" y2="807" stroke="#D95C86" stroke-width="3"/>
    <line x1="278" y1="807" x2="532" y2="807" stroke="#D95C86" stroke-width="2" stroke-dasharray="6 4"/>
    <g id="arr-fringes" fill="#D95C86">
      <rect x="536" y="752" width="8" height="8" rx="2"/>
      <rect x="536" y="770" width="8" height="8" rx="2"/>
      <rect x="536" y="788" width="8" height="8" rx="2"/>
      <rect x="536" y="803" width="8" height="8" rx="2"/>
      <rect x="536" y="818" width="8" height="8" rx="2"/>
      <rect x="536" y="836" width="8" height="8" rx="2"/>
      <rect x="536" y="854" width="8" height="8" rx="2"/>
    </g>
    <line x1="405" y1="940" x2="272" y2="940" stroke="#7F93A8" stroke-width="2" marker-end="url(#arGrey)"/>
    <line x1="405" y1="940" x2="536" y2="940" stroke="#7F93A8" stroke-width="2" marker-end="url(#arGrey)"/>
    <g id="arr-labels" font-size="19" fill="#2F3B4A" text-anchor="middle">
      <text x="158" y="776">Laser</text>
      <text x="268" y="744">Double slit</text>
      <text x="500" y="708">Screen</text>
      <text x="405" y="930" font-style="italic" font-weight="bold" fill="#4A5D72">D</text>
      <text x="344" y="978" font-size="18" fill="#6C8198">Laser, double slit and screen on one line</text>
    </g>
  </g>

  <g id="sec-procedure" data-pptx-bounds="632 626 528 372">
    <rect x="632" y="630" width="8" height="30" rx="4" fill="#EE8FB0"/>
    <text x="654" y="654" font-family="Georgia" font-size="26" font-weight="bold" fill="#2C6C9E">Procedure</text>
    <g id="procedure-numbers" font-size="21" font-weight="bold" fill="#B8456F">
      <text x="632" y="700">1.</text>
      <text x="632" y="762">2.</text>
      <text x="632" y="824">3.</text>
      <text x="632" y="886">4.</text>
      <text x="632" y="948">5.</text>
    </g>
    <g id="procedure-steps" font-size="21" fill="#2F3B4A">
      <text x="662" y="700">Darken the room and mount the laser so<tspan x="662" dy="28">that its beam falls on the double slit.</tspan></text>
      <text x="662" y="762">Place the screen about 1 m away and<tspan x="662" dy="28">adjust until the fringes are sharp.</tspan></text>
      <text x="662" y="824">Measure <tspan font-style="italic">D</tspan> from the slit to the screen<tspan x="662" dy="28">with the metre scale.</tspan></text>
      <text x="662" y="886">Mark the fringes; measure the width of<tspan x="662" dy="28">10 fringes and divide by 10 to get <tspan font-style="italic">β</tspan>.</tspan></text>
      <text x="662" y="948">Repeat for two more values of <tspan font-style="italic">D</tspan> and<tspan x="662" dy="28">calculate <tspan font-style="italic">λ</tspan> each time.</tspan></text>
    </g>
  </g>

  <g id="sec-observations" data-pptx-bounds="80 1014 1080 286">
    <rect x="80" y="1018" width="8" height="30" rx="4" fill="#EE8FB0"/>
    <text x="102" y="1042" font-family="Georgia" font-size="26" font-weight="bold" fill="#2C6C9E">Observations</text>
    <text x="1160" y="1042" text-anchor="end" font-size="18" font-weight="bold" fill="#B8456F">SAMPLE OBSERVATIONS (illustrative values)</text>
    <text x="80" y="1080" font-size="21" fill="#2F3B4A">Slit separation, <tspan font-style="italic">d</tspan> = 0.25 mm = 2.5 × 10<tspan baseline-shift="super" font-size="14">−4</tspan> m.   Least count of the scale = 1 mm.</text>
    <rect x="80" y="1096" width="1080" height="204" rx="14" fill="#FFFFFF" stroke="#B9DCF5" stroke-width="1.5"/>
    <path d="M80 1150 V1110 A14 14 0 0 1 94 1096 H1146 A14 14 0 0 1 1160 1110 V1150 Z" fill="#BFE0F7"/>
    <path d="M80 1200 H1160 M80 1250 H1160 M190 1096 V1300 M410 1096 V1300 M680 1096 V1300 M920 1096 V1300" fill="none" stroke="#CFE6F7" stroke-width="1.5"/>
    <g id="obs-head" font-size="19" font-weight="bold" fill="#24557E" text-anchor="middle">
      <text x="135" y="1130">S. No.</text>
      <text x="300" y="1130">Distance <tspan font-style="italic">D</tspan> (m)</text>
      <text x="545" y="1130">Width of 10 fringes (mm)</text>
      <text x="800" y="1130">Fringe width <tspan font-style="italic">β</tspan> (mm)</text>
      <text x="1040" y="1130">Wavelength <tspan font-style="italic">λ</tspan> (nm)</text>
    </g>
    <g id="obs-serial" font-size="21" font-weight="bold" fill="#C2527C" text-anchor="middle">
      <text x="135" y="1183">1</text>
      <text x="135" y="1233">2</text>
      <text x="135" y="1283">3</text>
    </g>
    <g id="obs-data" font-size="21" fill="#2F3B4A" text-anchor="middle">
      <text x="300" y="1183">1.00</text>
      <text x="300" y="1233">1.50</text>
      <text x="300" y="1283">2.00</text>
      <text x="545" y="1183">26.0</text>
      <text x="545" y="1233">39.5</text>
      <text x="545" y="1283">52.0</text>
      <text x="800" y="1183">2.60</text>
      <text x="800" y="1233">3.95</text>
      <text x="800" y="1283">5.20</text>
      <text x="1040" y="1183">650</text>
      <text x="1040" y="1233">658</text>
      <text x="1040" y="1283">650</text>
    </g>
  </g>

  <g id="sec-formula" data-pptx-bounds="80 1316 344 148">
    <rect x="80" y="1316" width="344" height="148" rx="16" fill="#FDEEF3" stroke="#EE8FB0" stroke-width="2"/>
    <text x="252" y="1346" text-anchor="middle" font-size="18" fill="#6C8198">Formula used</text>
    <g id="f-lambda" data-pptx-replace-with="formula" data-pptx-x="100" data-pptx-y="1356" data-pptx-width="304" data-pptx-height="72" data-pptx-bounds="100 1356 304 72" font-weight="bold" fill="#B8456F" text-anchor="middle">
      <metadata type="application/json"><![CDATA[{"latex":"\\lambda=\\frac{\\beta d}{D}","display":"block","font_size":26,"color":"#B8456F","align":"center"}]]></metadata>
      <text x="218" y="1400" font-style="italic">λ  =</text>
      <text x="276" y="1382" font-style="italic">βd</text>
      <text x="276" y="1418" font-style="italic">D</text>
      <path d="M252 1391 H300" fill="none" stroke="#B8456F" stroke-width="2"/>
    </g>
    <text x="252" y="1450" text-anchor="middle" font-size="17" fill="#4A5D72">with <tspan font-style="italic">β</tspan>, <tspan font-style="italic">d</tspan> and <tspan font-style="italic">D</tspan> in metres</text>
  </g>
  <g id="sec-result" data-pptx-bounds="448 1316 712 148">
    <rect x="448" y="1316" width="712" height="148" rx="16" fill="#EAF5FD" stroke="#B9DCF5" stroke-width="1.5"/>
    <text x="472" y="1352" font-family="Georgia" font-size="24" font-weight="bold" fill="#2C6C9E">Result</text>
    <text x="472" y="1388" font-size="21" fill="#2F3B4A">Mean wavelength of the laser light = (650 + 658 + 650)/3 ≈ <tspan font-weight="bold" fill="#B8456F">653 nm</tspan>.<tspan x="472" dy="29">This lies in the red region and agrees with the value marked on</tspan><tspan x="472" dy="29">a typical red diode laser (about 650 nm).</tspan></text>
  </g>

  <g id="sec-precautions" data-pptx-bounds="80 1480 1080 140">
    <rect x="80" y="1484" width="8" height="30" rx="4" fill="#EE8FB0"/>
    <text x="102" y="1508" font-family="Georgia" font-size="26" font-weight="bold" fill="#2C6C9E">Precautions</text>
    <g id="precautions-list" font-size="21" fill="#2F3B4A">
      <text x="80" y="1546">• Never look directly into the laser beam or point it at anyone's eyes.</text>
      <text x="80" y="1578">• Keep the screen parallel to the plane of the slits and perform the experiment in a dark room.</text>
      <text x="80" y="1610">• Measure across many fringes rather than one, to reduce the error in <tspan font-style="italic">β</tspan>.</text>
    </g>
  </g>

  <g id="page-footer" data-pptx-role="footer" data-pptx-bounds="80 1650 1080 56">
    <line x1="80" y1="1654" x2="1160" y2="1654" stroke="#A7D3F2" stroke-width="2"/>
    <text x="80" y="1691" font-size="18" fill="#6C8198">Optics &amp; Wave Nature of Light  ·  Physics Investigatory Project</text>
    <circle cx="1136" cy="1684" r="22" fill="#FDEEF3" stroke="#F6BFD0" stroke-width="1.5"/>
    <text x="1136" y="1691" text-anchor="middle" font-size="20" font-weight="bold" fill="#C2527C">12</text>
  </g>
</svg>
