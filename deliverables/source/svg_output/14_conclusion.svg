      <path d="M592 1522 L650.0 1516.0 L1090 1490" stroke="#E57373"/>
      <path d="M592 1522 L651.5 1518.6 L1090 1503" stroke="#F2A65A"/>
      <path d="M592 1522 L653.0 1521.2 L1090 1516" stroke="#EBCB4A"/>
      <path d="M592 1522 L654.5 1523.8 L1090 1529" stroke="#7CCF8A"/>
      <path d="M592 1522 L656.0 1526.4 L1090 1542" stroke="#6BAEE8"/>
      <path d="M592 1522 L657.5 1529.0 L1090 1555" stroke="#7C83DB"/>
      <path d="M592 1522 L659.0 1531.6 L1090 1568" stroke="#B085E0"/>
    </g>
  </g>

