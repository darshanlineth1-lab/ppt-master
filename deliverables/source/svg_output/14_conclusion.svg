    <circle cx="1180" cy="60" r="6" fill="#A7D3F2"/>
    <circle cx="60" cy="1694" r="6" fill="#A7D3F2"/>
    <circle cx="1180" cy="1694" r="6" fill="#A7D3F2"/>
  </g>
  <g id="page-header" data-pptx-role="header" data-pptx-bounds="80 70 1080 100">
    <rect x="80" y="70" width="1080" height="100" rx="18" fill="url(#hdr)"/>
    <circle cx="140" cy="120" r="34" fill="#FFFFFF"/>
    <use data-icon="phosphor-duotone/check-circle" x="118" y="98" width="44" height="44" fill="#5AA9E0"/>
    <text x="196" y="106" font-size="17" fill="#5C7F9F">PHYSICS INVESTIGATORY PROJECT  ·  CLASS XII</text>
    <text x="196" y="150" font-family="Georgia" font-size="40" font-weight="bold" fill="#2C5F8A">Conclusion</text>
    <path d="M920 120 H1136" fill="none" stroke="#FFFFFF" stroke-width="2"/>
    <path d="M924 120 q13 -40 26 0 t26 0 t26 0 t26 0 t26 0 t26 0 t26 0 t26 0" fill="none" stroke="#EE8FB0" stroke-width="3"/>
  </g>

  <g id="sec-summary-head" data-pptx-bounds="80 205 1080 44">
    <rect x="80" y="211" width="8" height="32" rx="4" fill="#EE8FB0"/>
    <text x="102" y="236" font-family="Georgia" font-size="28" font-weight="bold" fill="#2C6C9E">Summary of Concepts</text>
  </g>

  <g id="sec-summary" data-pptx-bounds="80 252 1080 486">
    <g id="summary-bullets" font-size="23" font-weight="bold" fill="#D95C86">
      <text x="84" y="282">•</text>
      <text x="84" y="358">•</text>
      <text x="84" y="434">•</text>
      <text x="84" y="510">•</text>
      <text x="84" y="586">•</text>
      <text x="84" y="662">•</text>
    </g>
    <g id="summary-text" font-size="23" fill="#2F3B4A">
      <text x="108" y="282">Light is a transverse electromagnetic wave that travels in vacuum at 3 × 10<tspan baseline-shift="super" font-size="15">8</tspan> m/s and shows<tspan x="108" dy="32">both wave and particle behaviour.</tspan></text>
      <text x="108" y="358">Huygens' principle treats every point of a wavefront as a source of secondary wavelets and<tspan x="108" dy="32">explains reflection and refraction.</tspan></text>
      <text x="108" y="434">Reflection obeys i = r; refraction obeys Snell's law, and the refractive index measures how<tspan x="108" dy="32">much a medium slows light.</tspan></text>
      <text x="108" y="510">Dispersion arises because the refractive index depends on wavelength, so a prism splits white<tspan x="108" dy="32">light into a spectrum.</tspan></text>
      <text x="108" y="586">Visible light is only a small part of the electromagnetic spectrum, which extends from radio<tspan x="108" dy="32">waves to gamma rays.</tspan></text>
      <text x="108" y="662">In Young's double-slit experiment the fringe width β = λD/d allows the wavelength of light to be<tspan x="108" dy="32">measured.</tspan></text>
    </g>
  </g>

  <g id="sec-wave-head" data-pptx-bounds="80 748 1080 44">
    <rect x="80" y="754" width="8" height="32" rx="4" fill="#EE8FB0"/>
    <text x="102" y="779" font-family="Georgia" font-size="28" font-weight="bold" fill="#2C6C9E">Importance of Wave Optics</text>
  </g>

  <g id="card-interference" data-pptx-bounds="80 806 344 230">
    <rect x="80" y="806" width="344" height="230" rx="16" fill="#EAF5FD" stroke="#B9DCF5" stroke-width="1.5"/>
    <use data-icon="phosphor-duotone/target" x="100" y="824" width="44" height="44" fill="#5AA9E0"/>
    <text x="156" y="855" font-family="Georgia" font-size="24" font-weight="bold" fill="#2C5F8A">Interference</text>
    <text x="102" y="904" font-size="21" fill="#2F3B4A">Two coherent waves<tspan x="102" dy="29">superpose to give bright and</tspan><tspan x="102" dy="29">dark fringes. It proves the wave</tspan><tspan x="102" dy="29">nature of light and lets us</tspan><tspan x="102" dy="29">measure wavelength.</tspan></text>
  </g>

  <g id="card-diffraction" data-pptx-bounds="448 806 344 230">
    <rect x="448" y="806" width="344" height="230" rx="16" fill="#FDEEF3" stroke="#F6BFD0" stroke-width="1.5"/>
    <use data-icon="phosphor-duotone/aperture" x="468" y="824" width="44" height="44" fill="#D9739A"/>
    <text x="524" y="855" font-family="Georgia" font-size="24" font-weight="bold" fill="#B8456F">Diffraction</text>
    <text x="470" y="904" font-size="21" fill="#2F3B4A">Light bends round edges and<tspan x="470" dy="29">spreads into the shadow region.</tspan><tspan x="470" dy="29">It limits the resolving power of</tspan><tspan x="470" dy="29">every optical instrument.</tspan></text>
  </g>

  <g id="card-polarisation" data-pptx-bounds="816 806 344 230">
    <rect x="816" y="806" width="344" height="230" rx="16" fill="#F3EFFC" stroke="#D3C8EE" stroke-width="1.5"/>
    <use data-icon="phosphor-duotone/sun" x="836" y="824" width="44" height="44" fill="#A593D6"/>
    <text x="892" y="855" font-family="Georgia" font-size="24" font-weight="bold" fill="#6E5BB0">Polarisation</text>
    <text x="838" y="904" font-size="21" fill="#2F3B4A">Vibrations are confined to a<tspan x="838" dy="29">single plane. It proves that light</tspan><tspan x="838" dy="29">waves are transverse and is</tspan><tspan x="838" dy="29">used in sunglasses and LCDs.</tspan></text>
  </g>

  <g id="sec-life" data-pptx-bounds="80 1058 1080 194">
    <rect x="80" y="1064" width="8" height="32" rx="4" fill="#EE8FB0"/>
    <text x="102" y="1089" font-family="Georgia" font-size="28" font-weight="bold" fill="#2C6C9E">Optics in Everyday Life and Technology</text>
    <text x="80" y="1135" fill="#2F3B4A">Optics shapes daily life: spectacles and cameras form images by refraction, mirrors and<tspan x="80" dy="34">headlamps use reflection, optical fibres carry the internet by total internal reflection, and lasers</tspan><tspan x="80" dy="34">serve medicine and industry. Rainbows, the blue of the sky and the colours of soap films are</tspan><tspan x="80" dy="34">everyday displays of dispersion, scattering and interference.</tspan></text>
  </g>

  <g id="sec-closing" data-pptx-bounds="80 1268 1080 152">
    <rect x="80" y="1268" width="1080" height="152" rx="16" fill="#F3EFFC" stroke="#D3C8EE" stroke-width="1.5"/>
    <text x="108" y="1306" font-family="Georgia" font-size="24" font-weight="bold" fill="#5A4A9C">Closing Note</text>
    <text x="108" y="1340" font-size="22" fill="#2F3B4A">This project has traced the study of light from simple rays to electromagnetic waves. The wave model<tspan x="108" dy="30">explains interference, diffraction and polarisation, which ray optics cannot, and the double-slit</tspan><tspan x="108" dy="30">investigation shows that the wavelength of light can be measured with simple apparatus.</tspan></text>
  </g>

  <g id="motif-prism" data-pptx-bounds="80 1438 1080 184">
    <rect x="80" y="1438" width="1080" height="184" rx="16" fill="#F4FAFE" stroke="#CFE6F7" stroke-width="1.5"/>
    <path d="M130 1544 q25 -34 50 0 t50 0 t50 0 t50 0 t50 0 t50 0" fill="none" stroke="#EE8FB0" stroke-width="3"/>
