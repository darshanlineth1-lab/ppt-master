<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 1754" lang="en-IN" data-pptx-page-role="content" font-family="Arial" font-size="24">
  <defs>
    <linearGradient id="hdr" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#DCEFFB"/>
      <stop offset="100%" stop-color="#FCE4EC"/>
    </linearGradient>
    <marker id="arRose" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="12" refX="14" refY="6" orient="auto">
      <polygon points="0,0 16,6 0,12" fill="#D95C86"/>
    </marker>
  </defs>
  <rect id="page-bg" data-pptx-role="background" x="0" y="0" width="1240" height="1754" fill="#FFFFFF"/>
  <g id="page-frame" data-pptx-role="decoration" data-pptx-bounds="30 30 1180 1694">
    <rect x="30" y="30" width="1180" height="1694" rx="24" fill="none" stroke="#A7D3F2" stroke-width="3"/>
    <rect x="44" y="44" width="1152" height="1666" rx="14" fill="none" stroke="#F6BFD0" stroke-width="1.5"/>
    <circle cx="60" cy="60" r="6" fill="#A7D3F2"/>
    <circle cx="1180" cy="60" r="6" fill="#A7D3F2"/>
    <circle cx="60" cy="1694" r="6" fill="#A7D3F2"/>
    <circle cx="1180" cy="1694" r="6" fill="#A7D3F2"/>
  </g>
  <g id="page-header" data-pptx-role="header" data-pptx-bounds="80 70 1080 100">
    <rect x="80" y="70" width="1080" height="100" rx="18" fill="url(#hdr)"/>
    <circle cx="140" cy="120" r="34" fill="#FFFFFF"/>
    <use data-icon="phosphor-duotone/wave-sine" x="118" y="98" width="44" height="44" fill="#5AA9E0"/>
    <text x="196" y="106" font-size="17" fill="#5C7F9F">PHYSICS INVESTIGATORY PROJECT  ·  CLASS XII</text>
    <text x="196" y="150" font-family="Georgia" font-size="40" font-weight="bold" fill="#2C5F8A">Wave Theory of Light</text>
    <path d="M920 120 H1136" fill="none" stroke="#FFFFFF" stroke-width="2"/>
    <path d="M924 120 q13 -40 26 0 t26 0 t26 0 t26 0 t26 0 t26 0 t26 0 t26 0" fill="none" stroke="#EE8FB0" stroke-width="3"/>
  </g>

  <g id="sec-huygens" data-pptx-bounds="80 205 1080 160">
    <rect x="80" y="211" width="8" height="32" rx="4" fill="#EE8FB0"/>
    <text x="102" y="236" font-family="Georgia" font-size="28" font-weight="bold" fill="#2C6C9E">Huygens' Wave Theory</text>
    <text x="80" y="282" fill="#2F3B4A">In 1678 the Dutch physicist Christiaan Huygens proposed that light spreads out from a<tspan x="80" dy="34">source as a wave. His theory explained reflection and refraction and, later, interference</tspan><tspan x="80" dy="34">and diffraction, and correctly predicted that light travels slower in a denser medium.</tspan></text>
  </g>

  <g id="def-wavefront" data-pptx-bounds="80 388 1080 130">
    <rect x="80" y="388" width="1080" height="130" rx="16" fill="#FDEEF3" stroke="#F6BFD0" stroke-width="1.5"/>
    <text x="108" y="430" fill="#2F3B4A">A <tspan font-weight="bold" fill="#B8456F">wavefront</tspan> is the locus of all points of a medium that vibrate in the same phase at<tspan x="108" dy="34">a given instant. A <tspan font-weight="bold" fill="#B8456F">ray</tspan> is a line drawn perpendicular to the wavefront; it shows the</tspan><tspan x="108" dy="34">direction in which the wave, and its energy, travels.</tspan></text>
  </g>

  <g id="sec-types" data-pptx-bounds="80 548 1080 390">
    <rect x="80" y="560" width="8" height="32" rx="4" fill="#EE8FB0"/>
    <text x="102" y="585" font-family="Georgia" font-size="28" font-weight="bold" fill="#2C6C9E">Types of Wavefronts</text>
    <g id="types-panels" fill="#F4FAFE" stroke="#CFE6F7" stroke-width="1.5">
      <rect x="80" y="610" width="344" height="326" rx="16"/>
      <rect x="448" y="610" width="344" height="326" rx="16"/>
      <rect x="816" y="610" width="344" height="326" rx="16"/>
    </g>
    <g id="wf-spherical" fill="none">
      <circle cx="252" cy="738" r="40" stroke="#5AA9E0" stroke-width="2.5"/>
      <circle cx="252" cy="738" r="74" stroke="#5AA9E0" stroke-width="2.5"/>
      <circle cx="252" cy="738" r="108" stroke="#5AA9E0" stroke-width="2.5"/>
      <line x1="260" y1="730" x2="340" y2="650" stroke="#D95C86" stroke-width="2.5" marker-end="url(#arRose)"/>
      <line x1="244" y1="730" x2="164" y2="650" stroke="#D95C86" stroke-width="2.5" marker-end="url(#arRose)"/>
      <line x1="260" y1="746" x2="340" y2="826" stroke="#D95C86" stroke-width="2.5" marker-end="url(#arRose)"/>
      <line x1="244" y1="746" x2="164" y2="826" stroke="#D95C86" stroke-width="2.5" marker-end="url(#arRose)"/>
      <circle cx="252" cy="738" r="7" fill="#D95C86"/>
    </g>
    <g id="wf-cylindrical" fill="none" stroke="#5AA9E0" stroke-width="2.5">
      <ellipse cx="620" cy="664" rx="45" ry="13.5"/>
      <ellipse cx="620" cy="664" rx="85" ry="25.5"/>
      <ellipse cx="620" cy="664" rx="122" ry="36.5"/>
      <ellipse cx="620" cy="822" rx="45" ry="13.5"/>
      <ellipse cx="620" cy="822" rx="85" ry="25.5"/>
      <ellipse cx="620" cy="822" rx="122" ry="36.5"/>
      <path d="M575 664 V822 M665 664 V822 M535 664 V822 M705 664 V822 M498 664 V822 M742 664 V822"/>
      <line x1="620" y1="664" x2="620" y2="822" stroke="#D95C86" stroke-width="5"/>
      <line x1="630" y1="743" x2="772" y2="743" stroke="#D95C86" marker-end="url(#arRose)"/>
      <line x1="610" y1="743" x2="468" y2="743" stroke="#D95C86" marker-end="url(#arRose)"/>
    </g>
    <g id="wf-plane" fill="none">
      <path d="M880 640 V840 M930 640 V840 M980 640 V840 M1030 640 V840 M1080 640 V840" stroke="#5AA9E0" stroke-width="2.5"/>
      <line x1="846" y1="690" x2="1130" y2="690" stroke="#D95C86" stroke-width="2.5" marker-end="url(#arRose)"/>
      <line x1="846" y1="740" x2="1130" y2="740" stroke="#D95C86" stroke-width="2.5" marker-end="url(#arRose)"/>
      <line x1="846" y1="790" x2="1130" y2="790" stroke="#D95C86" stroke-width="2.5" marker-end="url(#arRose)"/>
    </g>
    <g id="types-captions" text-anchor="middle">
      <text x="252" y="722" font-size="20" font-weight="bold" fill="#B8456F">S</text>
      <text x="252" y="886" font-size="22" font-weight="bold" fill="#2C5F8A">Spherical wavefront</text>
      <text x="252" y="914" font-size="20" fill="#4A5D72">Point source S</text>
      <text x="620" y="886" font-size="22" font-weight="bold" fill="#2C5F8A">Cylindrical wavefront</text>
      <text x="620" y="914" font-size="20" fill="#4A5D72">Linear source (narrow slit)</text>
      <text x="988" y="886" font-size="22" font-weight="bold" fill="#2C5F8A">Plane wavefront</text>
      <text x="988" y="914" font-size="20" fill="#4A5D72">Source at a very large distance</text>
    </g>
  </g>

  <g id="sec-principle" data-pptx-bounds="80 964 510 440">
    <rect x="80" y="976" width="8" height="32" rx="4" fill="#EE8FB0"/>
    <text x="102" y="1001" font-family="Georgia" font-size="28" font-weight="bold" fill="#2C6C9E">Huygens' Principle</text>
    <text x="80" y="1049" fill="#2F3B4A"><tspan font-weight="bold" fill="#C2527C">1.</tspan> Every point on a wavefront acts as a<tspan x="80" dy="34">source of secondary wavelets, which</tspan><tspan x="80" dy="34">spread out in all directions with the</tspan><tspan x="80" dy="34">speed of the wave.</tspan></text>
    <text x="80" y="1199" fill="#2F3B4A"><tspan font-weight="bold" fill="#C2527C">2.</tspan> The new wavefront at any later time<tspan x="80" dy="34">is the forward envelope (common</tspan><tspan x="80" dy="34">tangent) of these secondary wavelets.</tspan></text>
    <text x="80" y="1315" fill="#2F3B4A">No backward wavefront is formed, since<tspan x="80" dy="34">the amplitude of the secondary wavelets</tspan><tspan x="80" dy="34">is zero in the backward direction.</tspan></text>
  </g>
  <g id="huygens-diagram" data-pptx-bounds="620 972 540 432">
    <rect x="620" y="972" width="540" height="432" rx="16" fill="#F4FAFE" stroke="#CFE6F7" stroke-width="1.5"/>
    <path d="M680 1000 A70 70 0 0 1 680 1140 M680 1055 A70 70 0 0 1 680 1195 M680 1110 A70 70 0 0 1 680 1250 M680 1165 A70 70 0 0 1 680 1305 M680 1220 A70 70 0 0 1 680 1360" fill="none" stroke="#A593D6" stroke-width="2" stroke-dasharray="6 4"/>
    <line x1="680" y1="1036" x2="680" y2="1324" stroke="#7F93A8" stroke-width="3"/>
    <line x1="750" y1="1036" x2="750" y2="1324" stroke="#2C8AD0" stroke-width="4"/>
    <line x1="750" y1="1125" x2="846" y2="1125" stroke="#D95C86" stroke-width="2.5" marker-end="url(#arRose)"/>
    <line x1="750" y1="1180" x2="846" y2="1180" stroke="#D95C86" stroke-width="2.5" marker-end="url(#arRose)"/>
    <line x1="750" y1="1235" x2="846" y2="1235" stroke="#D95C86" stroke-width="2.5" marker-end="url(#arRose)"/>
    <g id="huygens-points" fill="#D95C86">
      <circle cx="680" cy="1070" r="5"/>
      <circle cx="680" cy="1125" r="5"/>
      <circle cx="680" cy="1180" r="5"/>
      <circle cx="680" cy="1235" r="5"/>
      <circle cx="680" cy="1290" r="5"/>
    </g>
    <g id="huygens-legend" stroke-width="3">
      <line x1="884" y1="1054" x2="918" y2="1054" stroke="#7F93A8"/>
      <line x1="884" y1="1124" x2="918" y2="1124" stroke="#A593D6" stroke-dasharray="6 4"/>
      <line x1="884" y1="1220" x2="918" y2="1220" stroke="#2C8AD0" stroke-width="4"/>
      <line x1="884" y1="1316" x2="918" y2="1316" stroke="#D95C86" marker-end="url(#arRose)"/>
    </g>
    <g id="huygens-labels" font-size="20" fill="#2F3B4A">
      <text x="666" y="1050" text-anchor="end">A</text>
      <text x="666" y="1326" text-anchor="end">B</text>
      <text x="760" y="1050">A′</text>
      <text x="760" y="1326">B′</text>
      <text x="930" y="1061">Wavefront AB<tspan x="930" dy="26">at time t = 0</tspan></text>
      <text x="930" y="1131">Secondary<tspan x="930" dy="26">wavelets of</tspan><tspan x="930" dy="26">radius <tspan font-style="italic">vt</tspan></tspan></text>
      <text x="930" y="1227">New wavefront<tspan x="930" dy="26">A′B′ at time t</tspan><tspan x="930" dy="26">(envelope)</tspan></text>
      <text x="930" y="1323">Rays</text>
    </g>
  </g>

  <g id="note-wave-theory" data-pptx-bounds="80 1440 1080 150">
    <rect x="80" y="1440" width="1080" height="150" rx="16" fill="#F3EFFC" stroke="#D3C8EE" stroke-width="1.5"/>
    <text x="108" y="1486" fill="#2F3B4A"><tspan font-weight="bold" fill="#6E5BB0">Result:</tspan> Huygens' construction leads directly to the laws of reflection and to Snell's law<tspan x="108" dy="34">of refraction. When light enters a denser medium its speed and wavelength decrease</tspan><tspan x="108" dy="34">(<tspan font-style="italic">v = c/n</tspan>,  <tspan font-style="italic">λ′ = λ/n</tspan>), while its frequency remains unchanged.</tspan></text>
  </g>

  <g id="page-footer" data-pptx-role="footer" data-pptx-bounds="80 1650 1080 56">
    <line x1="80" y1="1654" x2="1160" y2="1654" stroke="#A7D3F2" stroke-width="2"/>
    <text x="80" y="1691" font-size="18" fill="#6C8198">Optics &amp; Wave Nature of Light  ·  Physics Investigatory Project</text>
    <circle cx="1136" cy="1684" r="22" fill="#FDEEF3" stroke="#F6BFD0" stroke-width="1.5"/>
    <text x="1136" y="1691" text-anchor="middle" font-size="20" font-weight="bold" fill="#C2527C">4</text>
  </g>
</svg>
